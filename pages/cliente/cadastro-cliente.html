<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Cliente</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../../css/cliente/cadastro.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link href="https://fonts.googleapis.com/css2?family=Delius&family=Nunito:wght@300;400;700;800&display=swap" rel="stylesheet">
</head>
<body class="body-cadastro">


<section class="section-cadastro">
  <div id="header"></div>
    <div class="card-cadastro">


      <div class="header-cadastro">
        <div class="icon-box"><img src="../../assents/img/Geral/cliente-cadastro.png" alt=""></div>
        <div>
          <h2>Cadastro para Clientes</h2>
          <p id="stepText">Passo 1 de 2</p>
        </div>
      </div>

      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

      <p class="description" id="description">
        Para aproveitar novos momentos doces e calorosos, <br>
        Preencha seus dados abaixo:
      </p>

      <div id="step1" class="visible-step">

        <div class="input-group-ca">
          <input type="text" name="nome" placeholder="Nome Completo" id="nome" required/>
        </div>

        <div class="input-group-ca">
          <input type="text" name="telefone" placeholder="Telefone" maxlength="15" id="telefone" required/>
        </div>

        <div class="input-group-ca">
          <input type="email" name="email" placeholder="Email" id="email" required/>
        </div>

        <div class="btn-container">
          <button class="button" id="nextBtn" type="button">Próximo</button>
        </div>
      </div>


      <div id="step2" class="hidden-step">

        <div class="input-group-ca">
          <input type="text" name="cpf" placeholder="CPF" maxlength="14" id="cpf" required/>
        </div>

        <div class="input-group-ca">
          <input type="date" name="nascimento" placeholder="Data de Nascimento" id="dt_nasc" required/>
        </div>

        <div class="input-group-ca">
          <input type="password" name="senha" placeholder="Senha" id="senha" required/>
          <button type="button" class="visible-pass" id="togglePassword" aria-label="Mostrar senha">
            <i class="fa-regular fa-eye"></i>
          </button>
        </div>

        <div class="input-group-ca">
          <input type="password" name="confirmarSenha" placeholder="Confirmar Senha" id="senhaCon" required/>
        </div>

        <div class="button-row">
          <button type="button" class="back-button button" id="backBtn">Voltar</button>
          <button class="button" type="submit" id="cadastrar">Cadastrar-me</button>
        </div>

      </div>



  </div>

</section>
  <div id="footer"></div>

<script src="../../js/cliente/cadastro.js"></script>
<script type="module" src="../../js/main.js"></script>
</body>
</html>
