<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Melfy</title>
  <link rel="stylesheet" href="./css/produtos.css" />
  <link rel="stylesheet" href="./css/header.css" />
  <link rel="stylesheet" href="./css/footer.css" />
  <link rel="stylesheet" href="./css/cores.css" />
  <script type="module" src="./js/produto.js" defer></script>
  <script src="./js/toggle.js" defer></script>
  <script src="./js/header.js" defer></script>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Istok+Web:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
</head>

<body>
  <div class="header-bg"></div>
  <div id="header"></div>

  <div class="inicio-botao-pesquisar" style="display:flex; justify-content:center; align-items:center; gap:12px; padding: 15px 20px;">
    <section class="search-bar" style="flex-grow:1; max-width:600px; display:flex; align-items:center; position:relative;">
      <input type="text" placeholder="Pesquisar..." />
      <div class="iconsearch" style="position:absolute; right:15px; cursor:pointer;">
        <i class="fas fa-search"></i>
      </div>
    </section>

    <div class="filtro" style="display:flex; align-items:center; gap:6px;">
      <button class="button-filtro">Filtro</button>
      <i class='bx bx-slider'></i>
    </div>
  </div>

  <main>
<div class="cards-wrapper"></div>

  </main>

  <div class="modal-overlay" id="product-modal">
    <div class="modal-content">
      <button class="modal-close" onclick="fecharModal()">×</button>

      <img src="" alt="" class="modal-img" />

      <div class="modal-info">
        <div class="modal-header">
          <div class="modal-loja">
            <img src="" alt="Logo da loja" class="modal-logo" />
            <span class="modal-nome-loja">Dama</span>
            <span class="modal-avaliacoes">★ 4.8</span>
          </div>
        </div>

        <h2 class="modal-title"></h2>
        <p class="modal-subtitulo"></p>
        <p class="modal-description"></p>
        <p class="modal-peso"></p>
        <p class="modal-price"></p>

        <label class="comentario">Comentário</label>
        <textarea id="comentario" rows="1" placeholder="Digite um comentário..." oninput="autoResize(this)"></textarea>

        <div class="modal-actions">
          <div class="modal-quantity">
            <button onclick="alterarQuantidade(-1)" class="qtd-btn">-</button>
            <span id="qtd-value">1</span>
            <button onclick="alterarQuantidade(1)" class="qtd-btn">+</button>
          </div>
          <button class="btn-add">Adicionar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>
</body>
</html>
