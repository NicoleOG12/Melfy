<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Melfy</title>
  <link rel="stylesheet" href="../../css/cliente/perfil.css" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
</head>

<body>
  <div class="header-bg"></div>
  <div id="header"></div>

  <main>
    <div class="perfil-layout">

      <aside class="perfil-aside">
        <div class="perfil-user-box">
          <img src="../../assents/img/Geral/Perfil.png" id="image-profile" />
          <div>
            <p id="nome-exibir"></p>
            <p id="email-exibir">E-mail</p>
          </div>
        </div>

        <nav class="perfil-menu">
          <a href="./perfil.html" class="menu-item"><i data-lucide="user"></i> Meus Dados</a>
          <a href="./perfil-enderecos.html" class="menu-item"><i data-lucide="map-pin"></i> Endereços</a>
          <a href="./perfil-formas-pag.html" class="menu-item"><i data-lucide="credit-card"></i> Formas de Pagamento</a>
          <a href="#" class="menu-item"><i data-lucide="bell"></i> Notificações</a>
          <a href="#" class="menu-item"><i data-lucide="shopping-bag"></i> Histórico de Compras</a>
          <a href="#" class="menu-item"><i data-lucide="ticket"></i> Meus Cupons</a>
        </nav>

        <div class="perfil-logout">
          <a href="#" id="botao-sair" onclick="sairConta()">
            <i data-lucide="log-out"></i> Sair
          </a>
        </div>
      </aside>

      <section class="perfil-content">
        <div class="dados-header">
          <h1 id="title-meus-dados">Meus Dados</h1>
          <p class="descricao-dados">Informações pessoais vinculadas à sua conta Melfy.</p>
        </div>

        <div class="dados-grid">
          <div class="dados-card">
            <label>Nome</label>
            <input type="text" id="nome-input" disabled />
          </div>

          <div class="dados-card">
            <label>Sobrenome</label>
            <input type="text" id="sobrenome-input" disabled />
          </div>

          <div class="dados-card">
            <label>CPF</label>
            <input type="text" id="cpf-input" disabled />
          </div>

          <div class="dados-card">
            <label>Data de Nascimento</label>
            <input type="text" id="dataNascimento-input" disabled />
          </div>

          <div class="dados-card">
            <label>E-mail</label>
            <input type="text" id="email-input" disabled />
          </div>

          <div class="dados-card">
            <label>Celular</label>
            <input type="text" id="celular-input" disabled />
          </div>
        </div>

        <div class="buttons">
          <button id="botao-editar" onclick="habilitarEdicao()">Editar</button>
        </div>
      </section>

    </div>
  </main>

  <div id="footer"></div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="../../js/cliente/perfil.js"></script>
  <script type="module" src="../../js/main.js"></script>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
