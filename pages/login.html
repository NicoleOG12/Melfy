<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/output.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
</head>
<body class="">
    <div id="header"></div>
    <section class="container">
        <div class="image-slider">
            <img src="../assents/img/Geral/confeiteira2 (1).png" class="ativa" alt="">
            <img src="../assents/img/Geral/confeiteira3.png" alt="">
            <img src="../assents/img/Geral/customers.png" alt="">
            <img src="../assents/img/Geral/cooking.jpg" alt="">
        <div class="slider-indicadores"></div>
        </div>


        <div class="login">
            <h1 class="titulo-login">Faça o seu login!</h1>
            <!-- <h3>O primeiro passo para um momento doce começa aqui.</h2> -->

            <div class="input-group w-0.5">
                <div class="input-container">
                    <i class="fa-solid fa-envelope icon" aria-hidden="true"></i>
                    <input type="email" placeholder="E-mail" name="email" />
                </div>

                <div class="input-container">
                    <i class="fa-solid fa-lock icon" aria-hidden="true"></i>
                    <input type="password" placeholder="Senha" id="senha" class="input-pass" name="senha" />
                    <button type="button" class="visible-pass" aria-label="Mostrar senha">
                    <i class="fa-regular fa-eye" aria-hidden="true"></i>
                    </button>
                </div>

                <a href="#" class="recup-senha">Esqueceu sua senha?</a>

                <div class="container-button">
                    <button class="btn-login">Login</button>
                </div>

                <p class="cadastro">Ainda não possui uma conta? <strong class="cadastro-strong">Cadastre-se aqui</strong></p>
            </div>

        </div>

    </section>

    <div id="footer"></div>
<script src="../js/image-slider.js"></script>
<script src="../js/pass.js"></script>
<script type="module" src="../js/main.js"></script>
</body>
</html>
