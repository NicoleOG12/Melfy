<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Melfy</title>
  <link rel="stylesheet" href="/css/confeiteira/cadastroLoja.css"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Delius&family=Nunito:wght@300;400;700;800&display=swap" rel="stylesheet">
</head>

<body>
  <div id="header"></div>

  <main>
    <div class="container">
      <div class="welcome-box">
        <h1>Bem-vindo à Melfy!</h1>
        <p>Crie sua loja e comece a vender seus doces com a gente!</p>
        <img src="" alt="" class="welcome-image" />
      </div> 
      
      <div class="login-box" id="form-novo">
        <form>
          <h2>Informações da Loja</h2>
  
          <div class="foto-perfil-container">
            <div class="foto-circular">
              <img id="fotoExibida" src="https://via.placeholder.com/150" alt="" />
            </div>
            <input type="file" id="fotoPerfil" accept="image/*" onchange="mostrarFotoPerfil(event)" />
            <label for="fotoPerfil" class="botao-upload">Selecionar Imagem</label>
          </div>
  
          <label for="nomeloja">Nome da Loja</label>
          <input type="text" id="nomeloja" placeholder="Digite o nome da loja" />
  
          <label for="horario">Horário de Funcionamento</label>
          <input type="text" id="horario" placeholder="Ex: Segunda a Sexta, 08:00 - 18:00" />
  
          <label for="descricao">Descrição</label>
          <textarea id="descricao" placeholder="Digite a descrição da loja" oninput="autoResize(this)"></textarea>
  
            <button type="button" class="btn-logar" onclick="continuar()">Continuar</button>
          </div>
        </form>
      </div>
    </div>
  </main>
  
  <div id="footer"></div>

  <script type="module" src= "./js/cadastroLoja.js"></script>
  <script type="module" src="../../js/main.js"></script>
  
</body>
</html>
