<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Melfy</title>
  <link rel="stylesheet" href="../../css/confeiteira/login.css"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Istok+Web:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>

<body class="body" onload="logar()">
  <div id="header"></div>

  <main>
    <section>
      <h1 class="titulo">Login</h1>
      <div class="container">
        <div class="login-box">
          <form>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Digite seu email">
    
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha">
            <a href="../esqueceuSenha.html" class="link">Esqueceu a senha?</a>
            <button type="button" class="btn-logar" onclick="logar()">Logar</button>
    
            <p class="cadastro">Não possui uma conta?</p>
            <a href="./cadastro.html" class="link-cadastro">Cadastre-se aqui</a>
        </form>
        </div>
    
        <div class="image-box">
          <img src="../../assents/img/Geral/BoloLogin.svg" alt="Bolo" class="cake">
        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script type="module"t src="../../js/confeiteira/login.js"></script>
  <script type="module" src="../../js/main.js"></script> 
  
</body>
</html>
