<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Melfy</title>
  <link rel="stylesheet" href="../css/esqueceuSenha.css"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Delius&family=Nunito:wght@300;400;700;800&display=swap" rel="stylesheet">
</head>

<body>
  <div class="header-bg"></div>
  <div id="header"></div>
  
  <main>
    <section>
      <h1 class="titulo">Redefinir Senha</h1>
      <div class="container">
        <div class="login-box">
          <form onsubmit="return redefinirSenha(event)">
            <label for="email">Email</label>
            <input type="email" id="emailRedefinir" placeholder="Digite seu email" required>
    
            <label for="senha">Senha</label>
            <input type="password" id="RedefinirSenha" placeholder="Nova senha" required>

            <label for="ConfirmarSenha">Confirmar Senha</label>
            <input type="password" id="ConfirmarSenha" placeholder="Confirme a senha" required>

            <button type="submit" class="btn-logar">Redefinir</button>
        </form>
        </div>
    
        <div class="image-box">
          <img src="../assents/img/Geral/BoloLogin.svg" alt="Bolo" class="cake">
        </div>
      </div>
    </section>
  </main>
  
  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/sweetalert.js"></script>
  <script type="module" src="../js/cliente/login.js"></script>
  <script type="module" src="../js/main.js"></script>

</body>
</html>
