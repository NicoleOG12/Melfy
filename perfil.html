<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Melfy</title>
  <link rel="stylesheet" href="./css/perfil.css"/>
  <link rel="stylesheet" href="./css/header.css">
  <link rel="stylesheet" href="./css/footer.css">
  <link rel="stylesheet" href="./css/cores.css">
  <script src="./js/toggle.js" defer></script>
  <script src="./js/header.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Istok+Web:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="header-bg"></div>
  <div id="header"></div>

  

  <h1 class="main-title"></h1>    

    <div class="container">
        <div class="item">
                                              <!-- CONTAINER TÓPICOS DO PERFIL -->
            <div class="item-container-perfil">
                <img src="img/cute-bee-design.avif" alt="" id="image-profile">
                <div class="item-nome-email">
                    <p id="nome-exibir"></p>
                    <p id="email-exibir">E-mail</p>
                </div>
            </div>
            <div class="item-topicos-flex">
              <div class="item-topicos">

              </div>
              <a href="perfil.html" class="a-topicos" id="meus-dados"><strong>MEUS DADOS</strong></a>
              <a href="perfil-enderecos.html" class="a-topicos"><strong>ENDEREÇOS</strong></a>
              <a href="perfil-formas-pag.html" class="a-topicos" id="forma-pg"><strong>FORMA DE PAGAMENTO</strong></a>
              
            </div>

            <div class="item-container-logout"><a href="#" id="botao-sair"><img src="./img/logout (2).png" class="img-logout" alt="" onclick="sairConta()"></a>
              
              <p></p>
            </div>
        </div>


                                              <!-- CONTAINER INPUTS MEUS DADOS -->

        <div class="item container-meus-dados">
          <h1 id="title-meus-dados">Meus Dados</h1>
          <div class="item-meus-dados-flex">
            <div class="item-meus-dados">
              <div class="item-meus-dados-input">
                <label for="">Nome</label>
                <input type="text" name="" id="nome-input" disabled>
              </div>
              <div class="item-meus-dados-input">
                <label for="">Sobrenome</label>
                <input type="text" name="" id="sobrenome-input" disabled>  
              </div>

              <div class="item-meus-dados-input">
                <label for="">CPF</label>
                <input type="text" name="" id="cpf-input" disabled>            
              </div>
            </div>
            
          <div class="item-meus-dados">
              <div class="item-meus-dados-input">
                <label>Data de Nascimento</label>
                <input type="text" name="" id="dataNascimento-input" disabled>
              </div>
              
              <div class="item-meus-dados-input">
                <label for="">E-mail</label>
                <input type="text" name="" id="email-input" disabled>
              </div>

              <div class="item-meus-dados-input">
                <label for="">Celular</label>
                <input type="text" name="" id="celular-input" disabled>
              </div>
          </div>   
          </div>

          
          <div>
                                                <!-- BOTÕES SALVAR E EDITAR -->
            <div class="item-container-buttons">

              <div class="item-buttons">
                <button id="botao-editar" onclick="habilitarEdicao()">Editar</button>
              </div>
            </div>
          </div>

        </div>
    </div>

    <div id="footer"></div>
    
  <script src="./js/perfil.js"></script>
  
</body>
</html>
